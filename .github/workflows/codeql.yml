name: CodeQL
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  kotlin-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37"
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile Kotlin for analysis
        run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --no-configuration-cache -Pkotlin.incremental=false -Pksp.incremental=false
      - uses: github/codeql-action/analyze@v4
