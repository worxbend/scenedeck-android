<?xml version="1.0" encoding="UTF-8"?>
<!-- SceneDeck master logo, 512x512.
     Mark: three fanned "deck" tiles pivoting at bottom center; the top tile is
     tally-red with a live dot and glow, on a deep-space indigo ground. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#201A38"/>
      <stop offset="1" stop-color="#0D0A16"/>
    </radialGradient>
    <radialGradient id="tallyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B4E" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FF3B4E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF3B4E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tally" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5563"/>
      <stop offset="1" stop-color="#F02A3F"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Back tile: brand violet -->
  <g transform="rotate(-18 256 330)">
    <rect x="146" y="187" width="220" height="150" rx="30" fill="#7C5CFF"/>
  </g>

  <!-- Middle tile: light lavender -->
  <rect x="146" y="187" width="220" height="150" rx="30" fill="#A79BFA"/>

  <!-- Top tile: tally red, glowing, live dot -->
  <g transform="rotate(18 256 330)">
    <circle cx="256" cy="262" r="125" fill="url(#tallyGlow)"/>
    <rect x="146" y="187" width="220" height="150" rx="30" fill="url(#tally)"/>
    <circle cx="256" cy="262" r="17" fill="#FFFFFF"/>
  </g>
</svg>
