<?xml version="1.0" encoding="UTF-8"?>
<!-- SceneDeck Play Store feature graphic, 1024x500.
     Mark left-of-center on deep-space indigo, tagline right of the mark,
     faint scene-card grid motif with one tally-red active card.
     Safe zone: no critical content within 60px of edges. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="bg" cx="0.40" cy="0.38" r="0.85">
      <stop offset="0" stop-color="#201A38"/>
      <stop offset="1" stop-color="#0D0A16"/>
    </radialGradient>
    <linearGradient id="tally" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5563"/>
      <stop offset="1" stop-color="#F02A3F"/>
    </linearGradient>
    <radialGradient id="tallyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B4E" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FF3B4E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF3B4E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B4E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF3B4E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Subtle scene-card grid motif (decorative, bleeds off edges) -->
  <g fill="none" stroke="#A79BFA" stroke-opacity="0.055" stroke-width="2">
    <g>
      <rect x="-20"  y="1"   width="175" height="105" rx="18"/>
      <rect x="181"  y="1"   width="175" height="105" rx="18"/>
      <rect x="382"  y="1"   width="175" height="105" rx="18"/>
      <rect x="583"  y="1"   width="175" height="105" rx="18"/>
      <rect x="784"  y="1"   width="175" height="105" rx="18"/>
      <rect x="985"  y="1"   width="175" height="105" rx="18"/>
      <rect x="-20"  y="132" width="175" height="105" rx="18"/>
      <rect x="181"  y="132" width="175" height="105" rx="18"/>
      <rect x="382"  y="132" width="175" height="105" rx="18"/>
      <rect x="583"  y="132" width="175" height="105" rx="18"/>
      <rect x="784"  y="132" width="175" height="105" rx="18"/>
      <rect x="985"  y="132" width="175" height="105" rx="18"/>
      <rect x="-20"  y="263" width="175" height="105" rx="18"/>
      <rect x="181"  y="263" width="175" height="105" rx="18"/>
      <rect x="382"  y="263" width="175" height="105" rx="18"/>
      <rect x="583"  y="263" width="175" height="105" rx="18"/>
      <rect x="784"  y="263" width="175" height="105" rx="18"/>
      <rect x="985"  y="263" width="175" height="105" rx="18"/>
      <rect x="-20"  y="394" width="175" height="105" rx="18"/>
      <rect x="181"  y="394" width="175" height="105" rx="18"/>
      <rect x="382"  y="394" width="175" height="105" rx="18"/>
      <rect x="784"  y="394" width="175" height="105" rx="18"/>
      <rect x="985"  y="394" width="175" height="105" rx="18"/>
    </g>
  </g>

  <!-- The one active card: tally red, bottom-right, with live dot and glow -->
  <g>
    <circle cx="670" cy="446" r="110" fill="url(#cardGlow)"/>
    <rect x="583" y="394" width="175" height="105" rx="18" fill="url(#tally)"/>
    <circle cx="670" cy="446" r="12" fill="#FFFFFF"/>
  </g>

  <!-- Logo mark (three fanned deck tiles, top tile tally red with live dot) -->
  <g transform="translate(10,66) scale(0.92)">
    <g transform="rotate(-18 256 330)">
      <rect x="146" y="187" width="220" height="150" rx="30" fill="#7C5CFF"/>
    </g>
    <rect x="146" y="187" width="220" height="150" rx="30" fill="#A79BFA"/>
    <g transform="rotate(18 256 330)">
      <circle cx="256" cy="262" r="125" fill="url(#tallyGlow)"/>
      <rect x="146" y="187" width="220" height="150" rx="30" fill="url(#tally)"/>
      <circle cx="256" cy="262" r="17" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="424" y="178" font-family="DejaVu Sans" font-weight="bold" font-size="22"
        letter-spacing="7" fill="#A79BFA">SCENEDECK</text>
  <text x="420" y="246" font-family="DejaVu Sans" font-weight="bold" font-size="35"
        fill="#F4F2FA">Stream from your PC.</text>
  <text x="420" y="296" font-family="DejaVu Sans" font-weight="bold" font-size="35"
        fill="#A79BFA">Control it from your phone.</text>
</svg>
